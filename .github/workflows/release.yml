name: release

# Automated releases driven by Conventional Commit messages.
#
# release-please watches commits on main and maintains a standing "release PR"
# containing the generated CHANGELOG.md and a version bump. Merging that PR
# creates the git tag and GitHub release. The tag then triggers base-image.yml,
# which builds and publishes the image and moves the :v<major> tag consumers pin.
#
# So the full hands-free chain is:
#   conventional commit -> release PR -> merge -> tag -> image published -> consumers
#   pick it up on their next ordinary rebuild.
#
# Version bumps follow the commit types: fix -> patch, feat -> minor,
# "!" or BREAKING CHANGE -> major (which is deliberate friction, since a major
# bump means every consumer must edit its FROM line).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed to approve the release PR's parked workflow runs.
  actions: write

# Never run two release PR updates at once - they would fight over the branch.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarise
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Released ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing the base image for this tag." >> "$GITHUB_STEP_SUMMARY"

      # Unblock the standing release PR.
      #
      # GitHub raises no workflow events at all for a pull request created with
      # the default GITHUB_TOKEN - the recursion guard again - so neither the
      # auto-merge workflow's pull_request_target nor the PR's own checks start
      # on their own. The checks are created but parked as action_required.
      #
      # This job DOES run (it is triggered by the push to main), so it is the one
      # place able to release them. Approving the queued runs lets the checks
      # execute; they still have to pass before auto-merge will land the PR.
      #
      # The alternative is a PAT or GitHub App token for release-please, which
      # would make its PRs behave like anyone else's. That is the documented fix,
      # and worth switching to if this needs to do much more - but it means a
      # credential to create, store and rotate.
      - name: Unblock and auto-merge the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --repo on every gh call: this job does not check the repo out, and
          # gh otherwise infers the repo from git remotes and fails with
          # "not a git repository".
          REPO='${{ github.repository }}'
          # Deliberately NOT `--search`: that hits GitHub's search index, which
          # is eventually consistent and had not caught up seconds after
          # release-please created the PR - the step reported "no open release
          # PR" and silently skipped. The plain list endpoint is immediately
          # consistent, so filter it with jq instead.
          #
          # Retried briefly anyway, since the PR is created moments earlier in
          # this same job.
          PR=""
          for attempt in 1 2 3 4 5; do
            PR=$(gh pr list --repo "$REPO" --state open --limit 50 \
                   --json number,headRefName \
                   --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                         | .[0].number // empty')
            [[ -n "$PR" ]] && break
            echo "No release PR yet (attempt ${attempt}); waiting..."
            sleep 5
          done
          if [[ -z "$PR" ]]; then
            echo "No open release PR."
            exit 0
          fi
          echo "Release PR is #${PR}"

          SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          # A parked run reports status=completed with conclusion=action_required,
          # NOT status=action_required - so filtering on status finds nothing.
          # Query unfiltered and select on either field.
          runs=$(gh api "/repos/${REPO}/actions/runs?head_sha=${SHA}" \
                   --jq '.workflow_runs[]
                         | select(.status == "action_required"
                                  or .conclusion == "action_required")
                         | .id' 2>/dev/null || true)
          for id in $runs; do
            echo "Approving queued run ${id}"
            gh api -X POST "/repos/${REPO}/actions/runs/${id}/approve" >/dev/null || true
          done

          # Auto-merge waits for the required checks, so this does not merge
          # anything that has not passed.
          gh pr merge --auto --squash --repo "$REPO" "$PR" || \
            echo "Could not enable auto-merge (is it enabled on the repository?)"

  # Publish the image for the tag release-please just created.
  #
  # Called directly rather than relying on a `push: tags:` trigger in
  # base-image.yml: release-please tags with the default GITHUB_TOKEN, and GitHub
  # suppresses workflow events for token-driven actions, so a tag trigger would
  # never fire and the image would silently never be published.
  publish-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/base-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
