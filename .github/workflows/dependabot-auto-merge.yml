name: bot-pr-auto-merge

# Hands-free merging of PRs opened by trusted GitHub automation.
#
# Approves and enables auto-merge, so GitHub merges each PR once its required
# checks pass. The gating is the whole point: with a required check on main, a
# broken bump blocks itself instead of shipping. Without one, auto-merge merges
# immediately and this workflow is only automating the click.
#
# Covered bots:
#   dependabot[bot]      version updates AND security updates (same actor).
#                        Majors are excluded - see below.
#   github-actions[bot]  release-please's `chore(main): release X.Y.Z` PR, which
#                        only ever bumps a version and regenerates CHANGELOG.md.
#
# A note on code scanning: CodeQL itself does not open pull requests - it raises
# alerts. What produces PRs from a security finding is a Dependabot security
# update, which arrives as dependabot[bot] and is therefore already covered.
# Copilot Autofix PRs, if enabled later, would arrive from a distinct actor and
# are deliberately NOT in the allowlist: those change source code rather than a
# pinned version, and want a human.
#
# MAJOR dependency updates stay excluded. Every consumer repo rebuilds onto this
# image, so a breaking change to the devcontainer base or to uv should be looked
# at by someone.
#
# Requires, on the repository:
#   Settings > General > "Allow auto-merge"
#   a branch ruleset on main requiring the `validate` check, or auto-merge lands
#   the PR instantly with nothing verified.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # pull_request_target runs with write access against the BASE repo, so it is
    # restricted to known automation actors and never checks out the PR's code.
    if: >-
      github.actor == 'dependabot[bot]' ||
      github.actor == 'github-actions[bot]'
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Only Dependabot PRs have update metadata; release PRs have none, so this
      # step is skipped for them and update-type is left empty.
      - name: Fetch Dependabot metadata
        id: meta
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          UPDATE_TYPE="${{ steps.meta.outputs.update-type }}"
          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "Major update - leaving for review."
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
            echo "Eligible for auto-merge (update-type: ${UPDATE_TYPE:-n/a})."
          fi

      - name: Approve
        if: steps.decide.outputs.merge == 'true'
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        if: steps.decide.outputs.merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Flag major updates for review
        if: steps.decide.outputs.merge == 'false'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump - not auto-merged. Every consumer repo rebuilds onto this image, so please review before merging."
