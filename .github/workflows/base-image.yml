name: base-image

# Build and publish the shared OpenNebula devcontainer base image.
#
# Consumers pin the MAJOR tag (e.g. :v1), so pushing v1.3.0 moves :v1 and every
# project picks the change up on its next ordinary rebuild - no file edit, and
# no second rebuild to "apply" it. Cut a new major tag for breaking changes.
#
# Multi-arch because development happens on Apple silicon while the servers are
# x86_64; a single-arch image would silently emulate or fail on one of them.

on:
  push:
    branches:
      - main
    paths:
      - 'images/base/**'
      - '.github/workflows/base-image.yml'
  pull_request:
    paths:
      - 'images/base/**'
      - '.github/workflows/base-image.yml'

  # Called by release.yml once release-please has cut a tag.
  #
  # This is deliberately NOT a `push: tags:` trigger. release-please creates the
  # tag using the default GITHUB_TOKEN, and GitHub does not raise workflow events
  # for actions taken with that token - a recursion guard. A tag trigger
  # therefore never fires for an automated release, and the image is silently
  # never published. Being called directly as a reusable workflow sidesteps the
  # event system entirely, with no PAT to create and rotate.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.2.0'
        type: string
        required: true

  # Manual re-publish of a specific tag, for recovery.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.2.0'
        type: string
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pocket-nebula-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When invoked for a release, build the tagged tree - not main, which
          # may already have moved on.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Only authenticate for pushes. Pull requests from forks have no package
      # write access, so they build-and-discard as a syntax check.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver patterns move :v1 and :v1.2 as well as writing :v1.2.3, which
          # is what lets consumers pin a major and still get fixes.
          # value= makes the semver patterns read the explicit input instead of
          # github.ref, which points at the caller's branch in a reusable workflow.
          # When no tag is supplied (a plain push to main) the semver entries are
          # skipped and only the branch/sha tags are produced.
          tags: |
            type=semver,pattern=v{{major}},value=${{ inputs.tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern=v{{version}},value=${{ inputs.tag }}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The whole inheritance mechanism depends on this label surviving the
      # build. If it is missing or malformed the merge silently does nothing,
      # so fail here rather than discovering it on someone's next rebuild.
      - name: Verify devcontainer.metadata label
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          echo "Inspecting $TAG"
          docker buildx imagetools inspect "$TAG" --format '{{ json .Image }}' \
            | python3 images/base/verify-metadata-label.py
